<div class="login-page">

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-container">
       <img src="assets/Loginlogo.png" alt="ASESCOMP" class="logo-imagen">
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

      <!-- Usuario -->
      <div class="input-group">
        <label for="usuario">Usuario</label>

        <div class="input-wrapper">
          <span class="input-icon">👤</span>

          <input id="usuario" name="usuario" type="text" [(ngModel)]="nombre" placeholder="Ingresa tu usuario" required
            autocomplete="username" />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="input-group">
        <label for="password">Contraseña</label>

        <div class="input-wrapper">
          <span class="input-icon">🔒</span>

          <input id="password" name="password" [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="pass"
            placeholder="Ingresa tu contraseña" required autocomplete="current-password" />

          <button type="button" class="show-password" (click)="mostrarPassword = !mostrarPassword">
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- Botón -->
      <button class="login-button" type="submit" [disabled]="loginForm.invalid || cargando">
        <span *ngIf="!cargando">Iniciar sesión</span>
        <span *ngIf="cargando">Iniciando sesión...</span>
      </button>

    </form>

    <!-- Footer -->
    <div class="login-footer">
      <small>© 2026 Asescomp · Todos los derechos reservados</small>
    </div>

  </div>

</div>
